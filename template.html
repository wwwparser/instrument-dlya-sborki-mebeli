<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Инструмент для сборки мебели</title>
<meta name="description" content="Инструмент и расходники для сборки кухонь и корпусной мебели: список из видеообзора сборщика с ценами и ссылками на Петрович.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0; --panel:#fff; --ink:#1c1c1a; --muted:#6a6963; --line:#e3e1da; --soft:#eeece6;
  --accent:#c2410c; --accent-soft:#fdeee4; --same:#2f7d4f; --same-soft:#e6f2ea;
  --c1:#c2410c; --c2:#b7791f; --c3:#2f7d6d; --c4:#2f6db3; --c5:#7c5cc4; --c6:#7a7a74; --c7:#a3a29b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --panel:#1e1e1c; --ink:#ecebe5; --muted:#a3a19a; --line:#34332f; --soft:#292825;
    --accent:#ff8f57; --accent-soft:#3a2317; --same:#6cc58f; --same-soft:#1c3024;
    --c1:#ff8f57; --c2:#e3b04b; --c3:#5fbfa9; --c4:#6ea8ec; --c5:#a891ea; --c6:#b3b2ab; --c7:#77766f;
  }
}
:root[data-theme="dark"]{
  --bg:#151513; --panel:#1e1e1c; --ink:#ecebe5; --muted:#a3a19a; --line:#34332f; --soft:#292825;
  --accent:#ff8f57; --accent-soft:#3a2317; --same:#6cc58f; --same-soft:#1c3024;
  --c1:#ff8f57; --c2:#e3b04b; --c3:#5fbfa9; --c4:#6ea8ec; --c5:#a891ea; --c6:#b3b2ab; --c7:#77766f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:56px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding-left:16px;padding-right:16px}
header{padding-top:40px;position:relative}
.eyebrow{color:var(--muted);font-size:13px;padding-right:48px}
h1{font-size:clamp(28px,4.4vw,44px);line-height:1.1;margin:8px 0 12px;letter-spacing:-.025em}
h2{font-size:21px;margin:0;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:780px;margin:0}
.kpis{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;margin-top:24px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .s{color:var(--muted);font-size:13px}
.kpi.total{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.total .l,.kpi.total .s{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.kpi.total .v{font-size:32px}
.theme{position:absolute;top:16px;right:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:16px}
nav{position:sticky;top:0;z-index:5;margin-top:24px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:8px;font-size:14px}
nav a:hover{background:var(--soft);color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px;margin-top:14px;font-size:14px}
.legend a{color:inherit;text-decoration:none;display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.legend a:hover{color:var(--accent)}
.legend b{white-space:nowrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
section{padding-top:34px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.sh .t{font-weight:700;font-size:18px;white-space:nowrap}
.gnote{color:var(--muted);font-size:14px;margin:0 0 12px;max-width:820px}
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.n{text-align:right;white-space:nowrap}
.video{color:var(--muted);font-size:13px}
.ts{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
.prod a{color:var(--ink);text-decoration:none;font-weight:500}
.prod a:hover{color:var(--accent);text-decoration:underline}
.cm{color:var(--muted);font-size:13px;margin-top:3px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:1px;white-space:nowrap}
.badge.analog{background:var(--accent-soft);color:var(--accent)}
.badge.same{background:var(--same-soft);color:var(--same)}
.code{font-size:12px;color:var(--muted)}
tfoot td{font-weight:700;background:var(--soft)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
a.chip{text-decoration:none}
a.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.missing{columns:2;column-gap:28px;margin:0;padding-left:18px}
.missing li{margin:4px 0;break-inside:avoid}
footer{color:var(--muted);font-size:13px;padding:40px 0 60px}
@media (max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi.total{grid-column:1/-1}
  .missing{columns:1}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{padding:12px 14px;border-bottom:1px solid var(--line)}
  tr:last-child{border-bottom:0}
  td{padding:0;border:0}
  td.video{margin-bottom:6px}
  td.n{text-align:left;display:inline-block;width:auto;margin-top:6px;margin-right:14px}
  td.n[data-l]::before{content:attr(data-l) ' ';color:var(--muted);font-weight:400}
  tfoot tr{display:flex;justify-content:space-between}
  tfoot td{background:none;width:auto}
}
</style>
</head>
<body>
<header class="wrap">
  <button class="theme" id="theme" type="button" aria-label="Сменить тему">◐</button>
  <div class="eyebrow">Цены Петровича, Москва, на <span id="date"></span></div>
  <h1 id="h1">Инструмент для сборки кухонь и корпусной мебели</h1>
  <p class="lead" id="lead"></p>
  <div class="controls" id="variants"></div>
  <div class="kpis" id="kpis"></div>
</header>
<nav><div class="wrap" id="nav"></div></nav>
<main class="wrap">
  <section id="summary">
    <div class="card">
      <div class="bar" id="bar"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="controls" id="filter">
      <button class="chip" type="button" data-f="all" aria-pressed="true">Все позиции</button>
      <button class="chip" type="button" data-f="same">Как в видео</button>
      <button class="chip" type="button" data-f="analog">Только аналоги</button>
    </div>
  </section>
  <div id="groups"></div>
  <section id="missing">
    <div class="sh"><h2>Нет в Петровиче</h2></div>
    <p class="gnote" id="missingnote"></p>
    <div class="card"><ul class="missing" id="missinglist"></ul></div>
  </section>
</main>
<footer class="wrap">
  Цены — розничные цены Петровича в Москве на <span id="date2"></span>, могут измениться: перед покупкой проверяйте по ссылкам. Таймкоды в скобках — место в видеообзоре, где автор показывает инструмент.
</footer>

<script id="data" type="application/json">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const rub = v => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(v)) + ' ₽';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const date = D.date.split('-').reverse().join('.');
$('date').textContent = date; $('date2').textContent = date;

(() => {
  const r = document.documentElement;
  try { const t = localStorage.getItem('theme'); if (t) r.dataset.theme = t; } catch(e) {}
  $('theme').onclick = () => {
    const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('theme', r.dataset.theme); } catch(e) {}
  };
})();

document.title = D.h1;
$('h1').textContent = D.h1;
$('lead').textContent = D.lead;
$('variants').innerHTML = D.pages.map(p =>
  `<a class="chip" href="${esc(p.file)}" aria-pressed="${p.current}">${esc(p.label)}</a>`).join('');

const power = D.groups.find(g => g.key === 'power').total;
const cons = D.groups.filter(g => ['fasteners','chem'].includes(g.key)).reduce((a,g) => a + g.total, 0);
const diff = Math.abs(D.total - D.other);
$('kpis').innerHTML = [
  ['Итого', rub(D.total), `${D.count} позиций`, 'total'],
  ['Электроинструмент', rub(power), `${Math.round(power / D.total * 100)} % суммы`],
  D.variant === 'econom'
    ? ['Экономия', rub(diff), `дешевле основного списка на ${Math.round(diff / D.other * 100)} %`]
    : ['Расходники', rub(cons), 'крепёж, клей, ленты, химия'],
  ['Аналоги', D.analogs, `из ${D.count}: модели из видео нет в Петровиче`],
].map(([l,v,s,c]) => `<div class="kpi ${c||''}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');

const color = i => `var(--c${i+1})`;
const SHORT = {power:'Электроинструмент', bits:'Оснастка', measure:'Измерение', hand:'Ручной инструмент', storage:'Хранение', fasteners:'Крепёж', chem:'Клей, ленты, химия'};
$('nav').innerHTML = D.groups.map(g => `<a href="#g-${g.key}">${SHORT[g.key]}</a>`).join('') + '<a href="#missing">Нет в Петровиче</a>';
$('bar').innerHTML = D.groups.map((g,i) => `<span style="width:${g.total/D.total*100}%;background:${color(i)}" title="${esc(g.title)}"></span>`).join('');
$('legend').innerHTML = D.groups.map((g,i) => `<a href="#g-${g.key}"><span><i style="background:${color(i)}"></i>${esc(g.title)}</span><b>${rub(g.total)}</b></a>`).join('');

let filter = 'all';
function render(){
  $('groups').innerHTML = D.groups.map((g,i) => {
    const rows = g.rows.filter(r => filter === 'all' || r.match === filter);
    if (!rows.length) return '';
    const sum = rows.reduce((a,r) => a + r.sum, 0);
    return `<section id="g-${g.key}">
      <div class="sh"><h2><span style="color:${color(i)}">■</span> ${esc(g.title)}</h2><span class="t">${rub(sum)}</span></div>
      ${g.note ? `<p class="gnote">${esc(g.note)}</p>` : '<div style="height:6px"></div>'}
      <div class="tablebox"><table>
        <thead><tr><th style="width:30%">В видео</th><th>В Петровиче</th><th class="n">Кол-во</th><th class="n">Цена</th><th class="n">Сумма</th></tr></thead>
        <tbody>${rows.map(r => {
          const m = r.video.match(/^(.*?)\s*(\[[\d:]+\])?$/);
          return `<tr>
            <td class="video">${esc(m[1])} ${m[2] ? `<span class="ts">${m[2]}</span>` : ''}</td>
            <td class="prod"><span class="badge ${r.match}">${r.match === 'analog' ? 'аналог' : 'как в видео'}</span><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a> <span class="code">· ${r.code}</span>${r.comment ? `<div class="cm">${esc(r.comment)}</div>` : ''}</td>
            <td class="n" data-l="Кол-во:">${r.qty} ${esc(r.unit)}</td>
            <td class="n" data-l="Цена:">${rub(r.price)}</td>
            <td class="n" data-l="Сумма:"><b>${rub(r.sum)}</b></td></tr>`;
        }).join('')}</tbody>
        <tfoot><tr><td colspan="4">Итого по группе</td><td class="n">${rub(sum)}</td></tr></tfoot>
      </table></div></section>`;
  }).join('');
}
render();
$('filter').onclick = e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  filter = b.dataset.f;
  $('filter').querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
};
$('missingnote').textContent = D.missing_note;
$('missinglist').innerHTML = D.missing.map(([n,t]) => `<li>${esc(n)} <span class="ts">${esc(t)}</span></li>`).join('');
</script>
</body>
</html>
