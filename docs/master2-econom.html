<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const rub = v => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(v)) + ' ₽';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const date = D.date.split('-').reverse().join('.');
$('date').textContent = date; $('date2').textContent = date;

(() => {
  const r = document.documentElement;
  try { const t = localStorage.getItem('theme'); if (t) r.dataset.theme = t; } catch(e) {}
  $('theme').onclick = () => {
    const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('theme', r.dataset.theme); } catch(e) {}
  };
})();

document.title = D.h1;
$('h1').textContent = D.h1;
$('lead').textContent = D.lead;
$('variants').innerHTML = D.pages.map(p =>
  `<a class="chip" href="${esc(p.file)}" aria-pressed="${p.current}">${esc(p.label)}</a>`).join('');

const power = D.groups.find(g => g.key === 'power').total;
const cons = D.groups.filter(g => ['fasteners','chem'].includes(g.key)).reduce((a,g) => a + g.total, 0);
const diff = Math.abs(D.total - D.other);
$('kpis').innerHTML = [
  ['Итого', rub(D.total), `${D.count} позиций`, 'total'],
  ['Электроинструмент', rub(power), `${Math.round(power / D.total * 100)} % суммы`],
  D.variant === 'econom'
    ? ['Экономия', rub(diff), `дешевле основного списка на ${Math.round(diff / D.other * 100)} %`]
    : ['Расходники', rub(cons), 'крепёж, клей, ленты, химия'],
  ['Аналоги', D.analogs, `из ${D.count}: модели из видео нет в Петровиче`],
].map(([l,v,s,c]) => `<div class="kpi ${c||''}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');

const color = i => `var(--c${i+1})`;
const SHORT = {power:'Электроинструмент', bits:'Оснастка', measure:'Измерение', hand:'Ручной инструмент', storage:'Хранение', fasteners:'Крепёж', chem:'Клей, ленты, химия'};
$('nav').innerHTML = D.groups.map(g => `<a href="#g-${g.key}">${SHORT[g.key]}</a>`).join('') + '<a href="#missing">Нет в Петровиче</a>';
$('bar').innerHTML = D.groups.map((g,i) => `<span style="width:${g.total/D.total*100}%;background:${color(i)}" title="${esc(g.title)}"></span>`).join('');
$('legend').innerHTML = D.groups.map((g,i) => `<a href="#g-${g.key}"><span><i style="background:${color(i)}"></i>${esc(g.title)}</span><b>${rub(g.total)}</b></a>`).join('');

let filter = 'all';
function render(){
  $('groups').innerHTML = D.groups.map((g,i) => {
    const rows = g.rows.filter(r => filter === 'all' || r.match === filter);
    if (!rows.length) return '';
    const sum = rows.reduce((a,r) => a + r.sum, 0);
    return `<section id="g-${g.key}">
      <div class="sh"><h2><span style="color:${color(i)}">■</span> ${esc(g.title)}</h2><span class="t">${rub(sum)}</span></div>
      ${g.note ? `<p class="gnote">${esc(g.note)}</p>` : '<div style="height:6px"></div>'}
      <div class="tablebox"><table>
        <thead><tr><th style="width:30%">В видео</th><th>В Петровиче</th><th class="n">Кол-во</th><th class="n">Цена</th><th class="n">Сумма</th></tr></thead>
        <tbody>${rows.map(r => {
          const m = r.video.match(/^(.*?)\s*(\[[\d:]+\])?$/);
          return `<tr>
            <td class="video">${esc(m[1])} ${m[2] ? `<span class="ts">${m[2]}</span>` : ''}</td>
            <td class="prod"><span class="badge ${r.match}">${r.match === 'analog' ? 'аналог' : 'как в видео'}</span><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a> <span class="code">· ${r.code}</span>${r.comment ? `<div class="cm">${esc(r.comment)}</div>` : ''}</td>
            <td class="n" data-l="Кол-во:">${r.qty} ${esc(r.unit)}</td>
            <td class="n" data-l="Цена:">${rub(r.price)}</td>
            <td class="n" data-l="Сумма:"><b>${rub(r.sum)}</b></td></tr>`;
        }).join('')}</tbody>
        <tfoot><tr><td colspan="4">Итого по группе</td><td class="n">${rub(sum)}</td></tr></tfoot>
      </table></div></section>`;
  }).join('');
}
render();
$('filter').onclick = e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  filter = b.dataset.f;
  $('filter').querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
};
$('missingnote').textContent = D.missing_note;
$('missinglist').innerHTML = D.missing.map(([n,t]) => `<li>${esc(n)} <span class="ts">${esc(t)}</span></li>`).join('');
</script>
